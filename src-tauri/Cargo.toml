[package]
name = "dh-photo-tagger"
version = "0.1.0"
description = "Match downhill race photos to athletes using r4wrun.com timing data"
authors = ["Timo Lehnertz"]
edition = "2021"

[lib]
name = "dh_photo_tagger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kamadak-exif = "0.6"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
